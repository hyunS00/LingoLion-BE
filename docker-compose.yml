services:
  postgres:
    image: postgres:latest
    container_name: lingolion_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./.env

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: lingolion_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    restart: always

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: lingolion_node_exporter
    ports:
      - '9100:9100'
    restart: always

  grafana:
    image: grafana/grafana-oss:11.1.5
    container_name: lingolion_grafana
    restart: always
    ports:
      - 8080:8080
    environment:
      - GF_SERVER_HTTP_PORT=8080
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage:
  postgres_data:
